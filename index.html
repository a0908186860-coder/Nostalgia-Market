<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>記憶柑仔店</title>
  <style>
    :root {
      --ink: #4c3025;
      --cream: #fff5d9;
      --paper: #fffaf0;
      --red: #a83d2f;
      --red-dark: #743025;
      --green: #46734d;
      --gold: #e0a43d;
      --wood: #7d4d2f;
      --wood-dark: #4d2d20;
      --shadow: 0 5px 0 rgba(76, 48, 37, .18), 0 10px 22px rgba(76, 48, 37, .14);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      color: var(--ink);
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.35) 0 2px, transparent 3px),
        linear-gradient(150deg, #eecf91, #c98d54);
      background-size: 28px 28px, auto;
    }
    button { font: inherit; touch-action: manipulation; }
    button:focus-visible, input:focus-visible + .switch {
      outline: 4px solid #2276c9;
      outline-offset: 3px;
    }

    .app {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(8px, 1.4vw, 18px);
      gap: clamp(7px, 1vw, 13px);
    }
    .topbar, .footer-bar {
      border: 3px solid var(--wood-dark);
      background: rgba(255, 247, 220, .96);
      box-shadow: var(--shadow);
      border-radius: 18px;
    }
    .topbar {
      min-height: 76px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .shop-sign {
      flex: 0 0 auto;
      padding: 7px 15px;
      border: 3px solid #f1c571;
      border-radius: 11px;
      color: #fff8db;
      background: var(--red);
      box-shadow: inset 0 0 0 3px var(--red-dark);
      font-family: "DFKai-SB", "BiauKai", serif;
      font-size: clamp(25px, 3vw, 42px);
      font-weight: 900;
      letter-spacing: .08em;
      white-space: nowrap;
    }
    .subline { font-size: clamp(13px, 1.35vw, 19px); font-weight: 800; color: #75523f; }
    .status-row { display: flex; align-items: center; justify-content: flex-end; gap: 9px; flex-wrap: wrap; }
    .badge {
      padding: 7px 12px;
      border: 2px solid #ad7953;
      border-radius: 999px;
      background: #fff6d9;
      font-size: clamp(14px, 1.3vw, 18px);
      font-weight: 900;
      white-space: nowrap;
    }
    .toggle-wrap {
      display: flex; align-items: center; gap: 7px; cursor: pointer;
      font-size: clamp(14px, 1.25vw, 18px); font-weight: 900; white-space: nowrap;
    }
    .toggle-wrap input { position: absolute; opacity: 0; pointer-events: none; }
    .switch {
      width: 58px; height: 32px; padding: 3px; border-radius: 999px;
      background: #9d9488; border: 2px solid #67564b; transition: .2s;
    }
    .switch::after {
      content: ""; display: block; width: 22px; height: 22px; border-radius: 50%;
      background: white; box-shadow: 0 2px 3px #634; transition: .2s;
    }
    .toggle-wrap input:checked + .switch { background: var(--green); }
    .toggle-wrap input:checked + .switch::after { transform: translateX(26px); }

    .stage {
      min-height: 0;
      position: relative;
      overflow: hidden;
      border: 4px solid var(--wood-dark);
      border-radius: 20px;
      background:
        linear-gradient(rgba(255,248,224,.93), rgba(255,248,224,.93)),
        repeating-linear-gradient(90deg, #a76c42 0 45px, #885534 45px 48px);
      box-shadow: var(--shadow);
    }
    .screen { display: none; width: 100%; height: 100%; }
    .screen.active { display: flex; }

    .start-screen {
      align-items: center; justify-content: center; text-align: center;
      padding: clamp(12px, 3vw, 35px);
    }
    .start-card {
      width: min(930px, 96%); max-height: 100%; overflow: auto;
      padding: clamp(17px, 3vw, 34px);
      border: 3px dashed #b8814f; border-radius: 22px;
      background: rgba(255, 250, 235, .97);
    }
    .start-icon { font-size: clamp(44px, 7vw, 80px); line-height: 1; }
    h1 { margin: 7px 0; font-size: clamp(32px, 5vw, 60px); font-family: "DFKai-SB", "BiauKai", serif; }
    .intro { margin: 7px auto 17px; max-width: 760px; font-size: clamp(17px, 2vw, 25px); font-weight: 800; line-height: 1.55; }
    .difficulty-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
    .difficulty {
      min-height: 98px; padding: 12px 8px; cursor: pointer;
      border: 3px solid var(--wood-dark); border-radius: 18px;
      background: #f6d989; color: var(--ink); box-shadow: 0 5px 0 var(--wood);
      font-size: clamp(22px, 2.5vw, 31px); font-weight: 900;
    }
    .difficulty small { display: block; margin-top: 5px; font-size: clamp(12px, 1.2vw, 16px); font-weight: 800; }
    .difficulty:hover, .difficulty:active { transform: translateY(2px); box-shadow: 0 3px 0 var(--wood); background: #ffe7a8; }
    .start-note { margin: 16px 0 0; font-size: clamp(14px, 1.3vw, 18px); font-weight: 800; color: #6c513d; }

    .list-screen, .money-screen, .result-screen {
      align-items: center; justify-content: center; padding: clamp(10px, 2.4vw, 28px);
    }
    .paper-card {
      width: min(690px, 96%); max-height: 100%; overflow: auto;
      padding: clamp(17px, 3vw, 30px);
      border: 2px solid #c6a36e; border-radius: 6px 20px 8px 15px;
      background:
        repeating-linear-gradient(0deg, transparent 0 36px, rgba(93,145,168,.2) 37px 38px),
        #fffdf1;
      box-shadow: 7px 8px 0 rgba(95,54,33,.2);
      transform: rotate(-.4deg);
      text-align: center;
    }
    .paper-card h2 { margin: 0 0 8px; color: var(--red); font-family: "DFKai-SB", "BiauKai", serif; font-size: clamp(28px, 4vw, 45px); }
    .gentle { margin: 4px 0 11px; font-size: clamp(17px, 1.8vw, 23px); font-weight: 900; color: var(--green); }
    .list-items { display: grid; gap: 5px; max-width: 500px; margin: 0 auto; text-align: left; }
    .list-line {
      display: flex; align-items: center; gap: 12px; min-height: 42px;
      border-bottom: 2px dashed rgba(141,86,51,.38);
      font-family: "DFKai-SB", "BiauKai", serif; font-size: clamp(21px, 2.5vw, 31px); font-weight: 900;
    }
    .list-line .icon { width: 42px; text-align: center; }

    .shop-screen { padding: 10px; gap: 10px; min-height: 0; }
    .shelf-area { flex: 1 1 auto; min-width: 0; display: grid; grid-template-rows: auto 1fr; gap: 8px; }
    .section-label {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      min-height: 42px; padding: 5px 10px; border-radius: 12px;
      background: var(--wood); color: #fff9df; font-size: clamp(17px, 1.7vw, 23px); font-weight: 900;
    }
    .products {
      min-height: 0; overflow-y: auto; padding: 8px;
      display: grid; grid-template-columns: repeat(4, minmax(105px, 1fr)); gap: 9px;
      align-content: start;
      border: 8px solid var(--wood); border-radius: 14px;
      background: #e8ca92;
      scrollbar-width: thin;
    }
    .product {
      min-height: 112px; padding: 6px 4px; cursor: pointer;
      border: 3px solid #70472e; border-radius: 15px; background: #fff9e7;
      box-shadow: 0 4px 0 #95643e; color: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .product:hover, .product:active { background: #fff0b9; transform: translateY(2px); box-shadow: 0 2px 0 #95643e; }
    .product .emoji { font-size: clamp(33px, 4vw, 49px); line-height: 1.05; }
    .product .name { margin-top: 4px; font-size: clamp(16px, 1.55vw, 21px); font-weight: 900; line-height: 1.15; }
    .product .price { margin-top: 2px; color: var(--red); font-size: clamp(13px, 1.25vw, 17px); font-weight: 900; }
    .cart-panel {
      flex: 0 0 clamp(220px, 25vw, 320px); min-width: 0; min-height: 0;
      padding: 9px; border: 5px solid #7c5035; border-radius: 16px;
      display: grid; grid-template-rows: auto 1fr auto; gap: 8px;
      background: #f8e6b7;
    }
    .cart-title { text-align: center; font-size: clamp(20px, 2vw, 28px); font-weight: 900; }
    .cart-list { min-height: 0; overflow-y: auto; display: grid; align-content: start; gap: 6px; }
    .cart-empty { padding: 15px 6px; text-align: center; font-size: 17px; font-weight: 800; color: #79634f; }
    .cart-row {
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 5px;
      padding: 7px 8px; border: 2px solid #b88c5e; border-radius: 10px; background: #fffaf0;
      font-size: clamp(15px, 1.4vw, 19px); font-weight: 900;
    }
    .remove-one {
      min-width: 38px; min-height: 34px; cursor: pointer; border: 2px solid #8b493e; border-radius: 9px;
      background: #f8d4c9; color: #702f28; font-weight: 900;
    }
    .cart-actions { display: grid; gap: 6px; }

    .btn {
      min-height: 48px; padding: 8px 16px; cursor: pointer;
      border: 3px solid var(--wood-dark); border-radius: 13px;
      color: #fff; background: var(--green); box-shadow: 0 4px 0 #294f32;
      font-size: clamp(17px, 1.7vw, 23px); font-weight: 900;
    }
    .btn:hover, .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #294f32; filter: brightness(1.08); }
    .btn.secondary { background: #a34a3b; box-shadow: 0 4px 0 #682f27; }
    .btn.light { color: var(--ink); background: #f7dda2; box-shadow: 0 4px 0 #a57642; }
    .btn:disabled { opacity: .52; cursor: not-allowed; transform: none; }

    .footer-bar {
      min-height: 64px; padding: 7px 11px;
      display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px;
    }
    .message { font-size: clamp(16px, 1.7vw, 23px); font-weight: 900; line-height: 1.3; }
    .footer-actions { display: flex; gap: 8px; }
    .footer-actions .btn { min-height: 46px; }

    .money-card, .result-card {
      width: min(750px, 98%); max-height: 100%; overflow: auto; text-align: center;
      padding: clamp(15px, 2.5vw, 28px); border: 4px solid var(--wood-dark); border-radius: 22px;
      background: #fff9e8; box-shadow: var(--shadow);
    }
    .money-card h2, .result-card h2 { margin: 0 0 8px; font-size: clamp(27px, 3.5vw, 44px); color: var(--red); }
    .money-question { font-size: clamp(20px, 2.5vw, 31px); font-weight: 900; }
    .money-total { margin: 9px 0; font-size: clamp(18px, 2vw, 25px); font-weight: 900; color: var(--green); }
    .answer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .answer { min-height: 72px; font-size: clamp(23px, 3vw, 35px); }
    .calculation {
      display: none; margin-top: 14px; padding: 12px; border: 3px dashed #b18154; border-radius: 13px;
      background: #fff1c9; font-size: clamp(17px, 2vw, 25px); font-weight: 900; line-height: 1.5;
    }
    .result-icon { font-size: clamp(47px, 7vw, 82px); line-height: 1; }
    .result-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin: 14px 0; }
    .summary-box { padding: 12px 6px; border: 2px solid #b68857; border-radius: 14px; background: #fff0c6; font-weight: 900; }
    .summary-box b { display: block; margin-top: 4px; color: var(--red); font-size: clamp(19px, 2vw, 27px); }
    .result-actions { display: flex; justify-content: center; gap: 10px; }

    .toast {
      position: absolute; z-index: 20; left: 50%; top: 17px; transform: translateX(-50%) translateY(-15px);
      width: max-content; max-width: 90%; padding: 11px 19px; border: 3px solid var(--wood-dark); border-radius: 999px;
      background: #fff5c7; box-shadow: var(--shadow); text-align: center;
      font-size: clamp(17px, 1.8vw, 23px); font-weight: 900;
      opacity: 0; pointer-events: none; transition: .25s;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .list-overlay {
      display: none; position: absolute; z-index: 15; inset: 0; padding: 15px;
      align-items: center; justify-content: center; background: rgba(75,43,28,.67);
    }
    .list-overlay.show { display: flex; }
    .overlay-card { max-height: 95%; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 820px) {
      .app { padding: 6px; gap: 6px; }
      .topbar { min-height: 61px; padding: 5px 8px; }
      .subline { display: none; }
      .shop-sign { padding: 5px 9px; font-size: clamp(20px, 5.5vw, 31px); }
      .badge { padding: 5px 7px; }
      .toggle-label { display: none; }
      .shop-screen { flex-direction: column; padding: 6px; gap: 6px; }
      .shelf-area { min-height: 0; }
      .products { grid-template-columns: repeat(4, minmax(76px, 1fr)); gap: 5px; padding: 5px; border-width: 5px; }
      .product { min-height: 91px; border-width: 2px; }
      .cart-panel { flex: 0 0 142px; width: 100%; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; padding: 5px; gap: 4px; }
      .cart-title { grid-column: 1 / -1; font-size: 18px; }
      .cart-list { grid-column: 1; grid-row: 2; }
      .cart-actions { grid-column: 2; grid-row: 2; }
      .cart-row { padding: 3px 5px; font-size: 14px; }
      .remove-one { min-height: 29px; min-width: 32px; }
      .cart-actions .btn { min-height: 39px; padding: 4px 8px; font-size: 16px; }
      .footer-bar { min-height: 55px; padding: 5px 7px; }
      .footer-actions .btn { min-height: 40px; padding: 5px 8px; font-size: 15px; }
      .difficulty-grid { gap: 7px; }
    }

    @media (max-width: 560px) {
      .topbar { grid-template-columns: 1fr auto; }
      .status-row .badge:first-child { display: none; }
      .products { grid-template-columns: repeat(3, minmax(75px, 1fr)); }
      .product { min-height: 84px; }
      .difficulty-grid { grid-template-columns: 1fr; }
      .difficulty { min-height: 67px; }
      .start-card { padding: 13px; }
      .result-summary { gap: 5px; }
      .summary-box { padding: 7px 3px; font-size: 13px; }
      .result-actions { flex-direction: column; }
      .message { font-size: 15px; }
    }

    @media (max-height: 650px) {
      .app { padding: 5px; gap: 5px; }
      .topbar { min-height: 55px; }
      .shop-sign { font-size: 25px; }
      .stage { border-width: 3px; }
      .footer-bar { min-height: 50px; }
      .start-card { padding: 12px; }
      .start-icon { font-size: 35px; }
      h1 { font-size: 34px; }
      .intro { margin: 4px auto 8px; font-size: 16px; }
      .difficulty { min-height: 66px; font-size: 20px; padding: 6px; }
      .start-note { margin-top: 8px; }
      .product { min-height: 82px; }
      .product .emoji { font-size: 31px; }
      .section-label { min-height: 34px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="shop-sign">記憶柑仔店</div>
        <div class="subline">懷舊治療 × 記憶策略 × 執行功能訓練</div>
      </div>
      <div class="status-row">
        <div class="badge" id="difficultyBadge">尚未選擇難度</div>
        <div class="badge" id="moneyBadge">算錢挑戰：關閉</div>
        <label class="toggle-wrap" title="開啟或關閉算錢挑戰">
          <span class="toggle-label">算錢挑戰</span>
          <input id="moneyToggle" type="checkbox">
          <span class="switch" aria-hidden="true"></span>
        </label>
      </div>
    </header>

    <section class="stage" aria-live="polite">
      <div class="toast" id="toast"></div>

      <section class="screen start-screen active" id="startScreen">
        <div class="start-card">
          <div class="start-icon">🏮 🧺 🏮</div>
          <h1>記憶柑仔店</h1>
          <p class="intro">請先記住阿嬤交代的買菜清單，再到柑仔店把東西買齊。</p>
          <div class="difficulty-grid">
            <button class="difficulty" data-level="easy">簡單<small>記住 2 樣，慢慢熟悉</small></button>
            <button class="difficulty" data-level="medium">中等<small>記住 3～4 樣，動動腦</small></button>
            <button class="difficulty" data-level="hard">困難<small>記住 5 樣，挑戰自己</small></button>
          </div>
          <p class="start-note">可隨時自由開啟上方的「算錢挑戰」，不受難度限制。</p>
        </div>
      </section>

      <section class="screen list-screen" id="listScreen">
        <div class="paper-card">
          <h2>阿嬤的買菜清單</h2>
          <p class="gentle">慢慢看，記得阿嬤要買什麼喔</p>
          <div class="list-items" id="memoryList"></div>
        </div>
      </section>

      <section class="screen shop-screen" id="shopScreen">
        <div class="shelf-area">
          <div class="section-label">
            <span>🏪 柑仔店商品架</span>
            <span id="shopGuide">點一下商品，就會放進購物車</span>
          </div>
          <div class="products" id="products"></div>
        </div>
        <aside class="cart-panel">
          <div class="cart-title">🧺 我的購物車</div>
          <div class="cart-list" id="cartList"></div>
          <div class="cart-actions">
            <button class="btn" id="checkButton">我買好了</button>
            <button class="btn light" id="clearButton">清空購物車</button>
            <button class="btn secondary" id="shopDifficultyButton">切換難度</button>
          </div>
        </aside>
      </section>

      <section class="screen money-screen" id="moneyScreen">
        <div class="money-card">
          <h2>💰 算錢小挑戰</h2>
          <div class="money-question">阿嬤給你 250 元，請問買完要找回多少錢？</div>
          <div class="money-total" id="moneyTotal"></div>
          <div class="answer-grid" id="answerGrid"></div>
          <div class="calculation" id="calculation"></div>
        </div>
      </section>

      <section class="screen result-screen" id="resultScreen">
        <div class="result-card">
          <div class="result-icon">🌟</div>
          <h2>太棒了！今天幫阿嬤買得很準！</h2>
          <p class="gentle">謝謝你把清單上的東西都買齊了。</p>
          <div class="result-summary">
            <div class="summary-box">找對商品<b id="correctResult">0 樣</b></div>
            <div class="summary-box">完成清單<b id="listResult">完成</b></div>
            <div class="summary-box">算錢挑戰<b id="moneyResult">未開啟</b></div>
          </div>
          <div class="result-actions">
            <button class="btn" id="replayButton">再玩一次</button>
            <button class="btn secondary" id="homeButton">切換難度</button>
          </div>
        </div>
      </section>

      <div class="list-overlay" id="listOverlay">
        <div class="paper-card overlay-card">
          <h2>再看一次清單</h2>
          <p class="gentle">別急，慢慢想就好</p>
          <div class="list-items" id="overlayList"></div>
        </div>
      </div>
    </section>

    <footer class="footer-bar">
      <div class="message" id="message">請選擇一個適合自己的難度，準備好再開始。</div>
      <div class="footer-actions">
        <button class="btn light" id="reviewButton" hidden>再看一次清單</button>
        <button class="btn secondary" id="midDifficultyButton" hidden>切換難度</button>
      </div>
    </footer>
  </main>

  <script>
    "use strict";

    const PRODUCTS = [
      { id: "soy", name: "醬油", category: "調味", price: 25, icon: "🏺" },
      { id: "sweetPotato", name: "地瓜", category: "食材", price: 10, icon: "🍠" },
      { id: "biscuit", name: "傳統餅乾", category: "零嘴", price: 15, icon: "🍪" },
      { id: "candy", name: "懷舊糖果", category: "零嘴", price: 5, icon: "🍬" },
      { id: "ramune", name: "彈珠汽水", category: "飲料", price: 20, icon: "🫧" },
      { id: "sarsaparilla", name: "沙士", category: "飲料", price: 20, icon: "🥤" },
      { id: "noodle", name: "麵線", category: "食材", price: 30, icon: "🍜" },
      { id: "radish", name: "菜脯", category: "食材", price: 15, icon: "🥕" },
      { id: "soap", name: "肥皂", category: "日用", price: 20, icon: "🧼" },
      { id: "floralWater", name: "花露水", category: "日用", price: 35, icon: "🌸" },
      { id: "tinCandy", name: "鐵盒糖果", category: "零嘴", price: 30, icon: "🍭" },
      { id: "riceCracker", name: "米香", category: "零嘴", price: 10, icon: "🍘" },
      { id: "hawFlakes", name: "仙楂餅", category: "零嘴", price: 10, icon: "🔴" },
      { id: "can", name: "罐頭", category: "食材", price: 25, icon: "🥫" },
      { id: "slippers", name: "紅白拖鞋", category: "日用", price: 40, icon: "🩴" },
      { id: "towel", name: "毛巾", category: "日用", price: 30, icon: "🧣" },
      { id: "vinegar", name: "烏醋", category: "調味", price: 20, icon: "🍶" },
      { id: "riceWine", name: "米酒", category: "調味", price: 25, icon: "🍶" }
    ];

    const LEVELS = {
      easy: { label: "簡單", itemMin: 2, itemMax: 2, productCount: 7, memoryMs: 5000, maxQty: 1 },
      medium: { label: "中等", itemMin: 3, itemMax: 4, productCount: 11, memoryMs: 5000, maxQty: 2 },
      hard: { label: "困難", itemMin: 5, itemMax: 5, productCount: 16, memoryMs: 7000, maxQty: 3 }
    };

    const state = {
      level: null,
      target: {},
      shelf: [],
      cart: {},
      reviewUsed: false,
      moneyEnabled: false,
      moneyDone: false,
      moneyCorrect: false,
      memoryTimer: null,
      overlayTimer: null,
      toastTimer: null
    };

    const $ = (id) => document.getElementById(id);
    const screens = ["startScreen", "listScreen", "shopScreen", "moneyScreen", "resultScreen"];

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function productById(id) {
      return PRODUCTS.find((product) => product.id === id);
    }

    function setScreen(id) {
      screens.forEach((screenId) => $(screenId).classList.toggle("active", screenId === id));
    }

    function setMessage(text) {
      $("message").textContent = text;
    }

    function showToast(text) {
      clearTimeout(state.toastTimer);
      $("toast").textContent = text;
      $("toast").classList.add("show");
      state.toastTimer = setTimeout(() => $("toast").classList.remove("show"), 1800);
    }

    function updateMoneyStatus() {
      state.moneyEnabled = $("moneyToggle").checked;
      $("moneyBadge").textContent = `算錢挑戰：${state.moneyEnabled ? "開啟" : "關閉"}`;
    }

    function totalCost() {
      return Object.entries(state.target).reduce((sum, [id, qty]) => sum + productById(id).price * qty, 0);
    }

    function generateRound(levelKey) {
      const config = LEVELS[levelKey];
      const count = config.itemMin + Math.floor(Math.random() * (config.itemMax - config.itemMin + 1));
      let attempts = 0;
      let target = {};

      do {
        target = {};
        const candidates = shuffle(PRODUCTS).slice(0, count);
        candidates.forEach((product, index) => {
          let qty = 1;
          if (levelKey === "medium" && index === 1 && Math.random() > .35) qty = 2;
          if (levelKey === "hard") qty = [1, 2, 3, 1, 1][index];
          target[product.id] = qty;
        });
        state.target = target;
        attempts++;
      } while (totalCost() > 250 && attempts < 300);

      if (totalCost() > 250) {
        target = levelKey === "hard"
          ? { soy: 1, sweetPotato: 2, candy: 3, biscuit: 1, ramune: 2 }
          : levelKey === "medium"
            ? { soy: 1, sweetPotato: 2, biscuit: 1 }
            : { soy: 1, sweetPotato: 1 };
        state.target = target;
      }

      const targetIds = Object.keys(target);
      const similar = PRODUCTS.filter((product) =>
        !targetIds.includes(product.id) &&
        PRODUCTS.some((chosen) => targetIds.includes(chosen.id) && chosen.category === product.category)
      );
      const others = PRODUCTS.filter((product) => !targetIds.includes(product.id) && !similar.includes(product));
      const distractors = shuffle([...shuffle(similar), ...shuffle(others)]).slice(0, config.productCount - targetIds.length);
      state.shelf = shuffle([...targetIds.map(productById), ...distractors]);
      state.cart = {};
      state.reviewUsed = false;
      state.moneyDone = false;
      state.moneyCorrect = false;
    }

    function listMarkup() {
      return Object.entries(state.target).map(([id, qty]) => {
        const product = productById(id);
        return `<div class="list-line"><span class="icon">${product.icon}</span><span>${product.name} ${qty} ${quantityUnit(product)}</span></div>`;
      }).join("");
    }

    function quantityUnit(product) {
      if (["醬油", "彈珠汽水", "沙士", "花露水", "烏醋", "米酒"].includes(product.name)) return "瓶";
      if (product.name === "地瓜") return "條";
      if (["傳統餅乾", "麵線", "菜脯", "米香", "仙楂餅"].includes(product.name)) return "包";
      if (product.name === "懷舊糖果") return "顆";
      if (product.name === "肥皂") return "塊";
      if (product.name === "紅白拖鞋") return "雙";
      if (product.name === "毛巾") return "條";
      return "個";
    }

    function startRound(levelKey) {
      clearTimeout(state.memoryTimer);
      clearTimeout(state.overlayTimer);
      state.level = levelKey;
      updateMoneyStatus();
      generateRound(levelKey);
      $("difficultyBadge").textContent = `難度：${LEVELS[levelKey].label}`;
      $("memoryList").innerHTML = listMarkup();
      $("overlayList").innerHTML = listMarkup();
      $("reviewButton").hidden = true;
      $("reviewButton").textContent = "再看一次清單";
      $("midDifficultyButton").hidden = false;
      $("listOverlay").classList.remove("show");
      setScreen("listScreen");
      setMessage("慢慢看，記得阿嬤要買什麼喔。清單稍後會溫柔地收起來。");
      state.memoryTimer = setTimeout(openShop, LEVELS[levelKey].memoryMs);
    }

    function openShop() {
      clearTimeout(state.memoryTimer);
      renderProducts();
      renderCart();
      setScreen("shopScreen");
      $("reviewButton").hidden = false;
      $("midDifficultyButton").hidden = true;
      $("reviewButton").disabled = state.reviewUsed;
      setMessage("請照著記憶挑選商品。點一下商品，就會放進購物車。");
    }

    function renderProducts() {
      $("products").innerHTML = state.shelf.map((product) => `
        <button class="product" data-id="${product.id}" aria-label="將${product.name}放進購物車">
          <span class="emoji">${product.icon}</span>
          <span class="name">${product.name}</span>
          ${state.moneyEnabled ? `<span class="price">${product.price} 元</span>` : ""}
        </button>
      `).join("");
      document.querySelectorAll(".product").forEach((button) => {
        button.addEventListener("click", () => addToCart(button.dataset.id));
      });
    }

    function addToCart(id) {
      state.cart[id] = (state.cart[id] || 0) + 1;
      renderCart();
      if (state.target[id] && state.cart[id] <= state.target[id]) {
        showToast("放進購物車囉！");
        setMessage("很好，慢慢找下一樣就可以了。");
      } else if (state.target[id]) {
        showToast("購物車裡已經有這樣商品囉");
        setMessage("這樣商品似乎多放了一個，可以從購物車拿出來喔。");
      } else {
        showToast("這個好像不是清單上的東西，再找找看喔");
        setMessage("沒關係，想一想阿嬤的清單，也可以再看一次。");
      }
    }

    function removeOne(id) {
      state.cart[id]--;
      if (state.cart[id] <= 0) delete state.cart[id];
      renderCart();
      setMessage("已經把一樣商品放回架上了。");
    }

    function renderCart() {
      const entries = Object.entries(state.cart);
      if (!entries.length) {
        $("cartList").innerHTML = `<div class="cart-empty">購物車還是空的<br>從商品架挑選看看吧</div>`;
        return;
      }
      $("cartList").innerHTML = entries.map(([id, qty]) => {
        const product = productById(id);
        return `<div class="cart-row"><span>${product.icon} ${product.name} × ${qty}</span><button class="remove-one" data-id="${id}" aria-label="拿出一個${product.name}">拿出</button></div>`;
      }).join("");
      document.querySelectorAll(".remove-one").forEach((button) => {
        button.addEventListener("click", () => removeOne(button.dataset.id));
      });
    }

    function clearCart() {
      state.cart = {};
      renderCart();
      setMessage("購物車清空了，我們重新慢慢挑選。");
    }

    function reviewList() {
      if (state.reviewUsed) return;
      state.reviewUsed = true;
      $("reviewButton").disabled = true;
      $("reviewButton").textContent = "已經看過一次清單";
      $("listOverlay").classList.add("show");
      setMessage("這是本回合唯一一次再看清單的機會，慢慢看就好。");
      clearTimeout(state.overlayTimer);
      state.overlayTimer = setTimeout(() => {
        $("listOverlay").classList.remove("show");
        setMessage("清單收起來了，繼續慢慢挑選吧。");
      }, Math.max(5000, LEVELS[state.level].memoryMs * .65));
    }

    function checkCart() {
      const extras = Object.entries(state.cart).filter(([id, qty]) => !state.target[id] || qty > state.target[id]);
      const missing = Object.entries(state.target).filter(([id, qty]) => (state.cart[id] || 0) < qty);

      if (extras.length) {
        const name = productById(extras[0][0]).name;
        showToast("我們一起換成正確的");
        setMessage(`「${name}」好像不是阿嬤交代的數量，我們一起換成正確的。`);
        return;
      }
      if (missing.length) {
        showToast("還少一樣東西喔");
        setMessage("還少一樣東西喔，我們再回去找找看。");
        return;
      }

      $("reviewButton").hidden = true;
      $("midDifficultyButton").hidden = !state.moneyEnabled;
      showToast("太棒了！今天幫阿嬤買得很準！");
      if (state.moneyEnabled) {
        setTimeout(openMoneyChallenge, 800);
      } else {
        setTimeout(showResult, 800);
      }
    }

    function openMoneyChallenge() {
      const total = totalCost();
      const answer = 250 - total;
      const choices = new Set([answer]);
      const offsets = shuffle([-20, -15, -10, -5, 5, 10, 15, 20]);
      for (const offset of offsets) {
        const option = answer + offset;
        if (option >= 0 && option <= 250) choices.add(option);
        if (choices.size === 3) break;
      }
      $("moneyTotal").textContent = `這次買的商品合計 ${total} 元`;
      $("answerGrid").innerHTML = shuffle([...choices]).map((value) =>
        `<button class="btn answer" data-value="${value}">${value} 元</button>`
      ).join("");
      $("calculation").style.display = "none";
      setScreen("moneyScreen");
      $("midDifficultyButton").hidden = false;
      setMessage("算錢挑戰不影響通關，輕鬆想想看就好。");
      document.querySelectorAll(".answer").forEach((button) => {
        button.addEventListener("click", () => answerMoney(Number(button.dataset.value)));
      });
    }

    function answerMoney(value) {
      const total = totalCost();
      const answer = 250 - total;
      state.moneyDone = true;
      state.moneyCorrect = value === answer;
      const parts = Object.entries(state.target).map(([id, qty]) => {
        const product = productById(id);
        return qty === 1 ? `${product.price}` : `${product.price}×${qty}`;
      });
      $("calculation").innerHTML = `${state.moneyCorrect ? "算得很好！" : "我們一起算一次。"}<br>${parts.join(" + ")} = ${total}，所以 250 - ${total} = ${answer}`;
      $("calculation").style.display = "block";
      document.querySelectorAll(".answer").forEach((button) => button.disabled = true);
      setMessage(state.moneyCorrect ? "太棒了，找回的錢也算得很準！" : "沒關係，看著算式一起算一次，就會更熟悉。");
      setTimeout(showResult, 3300);
    }

    function showResult() {
      const targetCount = Object.values(state.target).reduce((sum, qty) => sum + qty, 0);
      $("correctResult").textContent = `${targetCount} 件`;
      $("listResult").textContent = "順利完成";
      $("moneyResult").textContent = !state.moneyEnabled ? "未開啟" : state.moneyCorrect ? "順利完成" : "一起練習過";
      setScreen("resultScreen");
      $("reviewButton").hidden = true;
      $("midDifficultyButton").hidden = true;
      setMessage("今天的任務完成了，每一次練習都很有幫助。");
    }

    function goHome() {
      clearTimeout(state.memoryTimer);
      clearTimeout(state.overlayTimer);
      state.level = null;
      state.target = {};
      state.cart = {};
      $("difficultyBadge").textContent = "尚未選擇難度";
      $("reviewButton").hidden = true;
      $("midDifficultyButton").hidden = true;
      $("reviewButton").textContent = "再看一次清單";
      $("listOverlay").classList.remove("show");
      setScreen("startScreen");
      setMessage("請選擇一個適合自己的難度，準備好再開始。");
    }

    document.querySelectorAll(".difficulty").forEach((button) => {
      button.addEventListener("click", () => startRound(button.dataset.level));
    });
    $("moneyToggle").addEventListener("change", () => {
      updateMoneyStatus();
      if (state.level && $("shopScreen").classList.contains("active")) renderProducts();
      setMessage(`算錢挑戰已${state.moneyEnabled ? "開啟" : "關閉"}。`);
    });
    $("checkButton").addEventListener("click", checkCart);
    $("clearButton").addEventListener("click", clearCart);
    $("reviewButton").addEventListener("click", reviewList);
    $("midDifficultyButton").addEventListener("click", goHome);
    $("shopDifficultyButton").addEventListener("click", goHome);
    $("replayButton").addEventListener("click", () => startRound(state.level));
    $("homeButton").addEventListener("click", goHome);
    updateMoneyStatus();
  </script>
</body>
</html>
